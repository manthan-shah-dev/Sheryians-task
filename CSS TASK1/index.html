<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

    <nav>
        <img src="/image/image1.png" alt="Pokemon Logo" class="logo">
    </nav>


    <div class="top">
        <input type="search" class="search" placeholder="Search Pokemon">
        <label>
            <input type="radio" class="filter">
            Filter
        </label>
    </div>


    <section class="center">

        <div class="card">

            <div class="card-top">
                <h4>#0908</h4>
                <span class="like-icon">♡</span>
            </div>

            <img src="/image/image2.png" alt="Meowscarada">

            <h2>Meowscarada</h2>

            <div class="type">
                🔥 GRASS
            </div>

        </div>


        <div class="card">

            <div class="card-top">
                <h4>#0624</h4>
                <span class="like-icon">♡</span>
            </div>

            <img src="/image/image4.png" alt="Pawniard">

            <h2>Pawniard</h2>

            <div class="type">
                🔥 DARK / STEEL
            </div>

        </div>


        <div class="card">

            <div class="card-top">
                <h4>#0229</h4>
                <span class="like-icon">♡</span>
            </div>

            <img src="/image/image3.png" alt="Houndoom">

            <h2>Houndoom</h2>

            <div class="type">
                🔥 DARK / FIRE
            </div>

        </div>


        <div class="card">

            <div class="card-top">
                <h4>#0686</h4>
                <span class="like-icon">♡</span>
            </div>

            <img src="/image/image4.png" alt="Inkay">

            <h2>Inkay</h2>

            <div class="type">
                🔥 DARK / PSYCHIC
            </div>

        </div>


    </section>


    <footer>
        <p>Pokémon Collection</p>
    </footer>

</div>
</body>

</html>
